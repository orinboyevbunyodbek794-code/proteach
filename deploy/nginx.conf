# /etc/nginx/sites-available/proteach.uz
# Faollashtirish:  sudo ln -s /etc/nginx/sites-available/proteach.uz /etc/nginx/sites-enabled/
#                  sudo nginx -t && sudo systemctl reload nginx
# HTTPS:           sudo certbot --nginx -d proteach.uz -d www.proteach.uz
#                  (certbot 443-port blokini va HTTP -> HTTPS yo'naltirishni o'zi qo'shadi)

# www.proteach.uz -> proteach.uz
server {
    listen 80;
    listen [::]:80;
    server_name www.proteach.uz;
    return 301 https://proteach.uz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name proteach.uz;

    # !!! MUHIM: video yuklash uchun so'rov hajmi chegarasi.
    # .env dagi MAX_VIDEO_MB (standart 200) dan biroz KATTA bo'lishi shart,
    # aks holda katta video yuklanganda "413 Request Entity Too Large" xatosi chiqadi.
    client_max_body_size 220M;
    client_body_timeout 300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # Yuklangan rasmlar va video — to'g'ridan-to'g'ri Nginx beradi (tezroq).
    # Faqat shu ikki papka ochiq; uploads/tmp tashqariga ko'rinmaydi.
    location /uploads/courses/ {
        alias /var/www/proteach/uploads/courses/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }
    location /uploads/video/ {
        alias /var/www/proteach/uploads/video/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # Qolgan hamma narsa — Node.js ilovasi (PM2, port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
